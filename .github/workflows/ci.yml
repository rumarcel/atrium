name: CI

# Every check that must pass before a change is merged. The Windows installer
# is built separately and on demand; this workflow never produces a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the application
        run: pnpm typecheck
      - name: Run frontend tests
        run: pnpm test

  rust:
    name: Rust build and tests
    # Windows-only crates and the WebView2 integration are compiled here, so
    # this must match the platform the application actually ships on.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Tauri's build script records absolute paths, so a cache produced
          # under a different checkout directory points at files that are no
          # longer there. Renaming the repository changes that directory, so
          # the repository name is part of the key.
          key: cargo-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.repository }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the frontend
        # tauri-build resolves the configured frontendDist, so the bundle has to
        # exist before the Rust crate is compiled.
        run: pnpm build
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  agent:
    name: Server agent tests
    # The agent targets Linux and refuses to run elsewhere, so its tests belong
    # on the platform administrators actually deploy it to.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run agent tests
        # Standard library only; the agent deliberately has no pip dependencies.
        run: python -m unittest test_agent test_inventory
        working-directory: server-agent

  server:
    name: Server workspace
    # Core and Agent target Linux. This job is independent of the Windows
    # Tauri job above: the two Cargo workspaces have separate manifests,
    # separate lockfiles and separate caches, and neither builds the other.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: server-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: server-${{ runner.os }}-${{ github.repository }}-
      - name: Generate the Turkish locale
        # Criterion 12's decode test asserts that case conversion is ASCII-only.
        # It must not silently skip, so the locale is generated here rather than
        # left to chance. The test is atrium-pairing/tests/turkish_locale.rs, which
        # fails rather than skips under CI when the locale is missing.
        run: |
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale
      - name: Check formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all --check
      - name: Lint
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --manifest-path server/Cargo.toml --all-targets --locked
      - name: Core refuses to run as root
        # The unit says User=atrium and the process checks for itself. This is
        # the only place the check can be exercised against a real uid 0, so it
        # runs here rather than in the test harness.
        run: |
          set +e
          sudo -E env ATRIUM_CORE_LOG=info ./server/target/debug/atrium-core
          status=$?
          set -e
          echo "exit status: ${status}"
          test "${status}" -ne 0
      - name: Run tests
        run: cargo test --manifest-path server/Cargo.toml --locked
      - name: Privileged tests (root and the atrium user)
        # docs/M1-TEST-PLAN.md section 5. Criterion 6 is proven against the
        # kernel — as the real atrium user, the identity key can be read and
        # cannot be written, truncated, unlinked, renamed over, chmodded or
        # created beside — which needs real root and a real service account.
        # M1C adds the Agent boundary: a root Agent on a socket-activated
        # 0660 root:atrium socket admits only the atrium uid (criterion 8),
        # keeps its state root-only (41), and journals what Core's audit
        # records (33). M1F adds the system domain against the real kernel:
        # two NICs on a veth pair (23), a bind mount and a tmpfs (24), CPU
        # under known load (22) and reads with Agent stopped (29).
        # The already-built test binaries run under sudo; cargo
        # itself does not, so nothing root-owned lands in the build tree.
        run: |
          getent group atrium || sudo groupadd --system atrium
          getent passwd atrium || sudo useradd --system --gid atrium --no-create-home \
            --home-dir /nonexistent --shell /usr/sbin/nologin atrium
          test -x /usr/bin/systemd-socket-activate
          for suite in atriumctl:privileged atrium-agent:privilege_boundary; do
            package="${suite%%:*}"
            target="${suite##*:}"
            binary="$(cargo test --manifest-path server/Cargo.toml --locked -p "${package}" \
              --test "${target}" --no-run --message-format=json \
              | jq -r --arg target "${target}" 'select(.reason == "compiler-artifact" and .target.name == $target and .executable != null) | .executable')"
            test -n "${binary}"
            echo "::group::${package} ${target}"
            # CI is passed through so tests that need a CI-guaranteed
            # facility (IPv6 on the runner) fail rather than skip.
            sudo --preserve-env=CI "${binary}" --ignored --test-threads=1
            echo "::endgroup::"
          done
      - name: Architecture and execution gates
        # Dependency direction, forbidden dependency families, no shell
        # execution, runtime socket paths only in Agent's send-nothing probe,
        # the parameterless operation table, unsafe confinement, and the
        # ADR-015 prototype-identifier reservations.
        run: bash server/ci/boundary-checks.sh
      - name: Validate systemd units
        # Informational. systemd-analyze resolves ExecStart and User, so its
        # exit status depends on machine state the runner does not have; the
        # blocking check on unit content is the deployment-policy test above.
        continue-on-error: true
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin atrium || true
          sudo install -D -m 0755 /bin/true /usr/lib/atrium/atrium-core
          sudo install -D -m 0755 /bin/true /usr/lib/atrium/atrium-agent
          systemd-analyze verify server/packaging/systemd/atrium-core.service \
                                 server/packaging/systemd/atrium-agent.service \
                                 server/packaging/systemd/atrium-agent.socket
