[workspace]
resolver = "2"
members = ["crates/*"]

# This is a second, independent Cargo workspace. The Windows desktop application
# in ../src-tauri keeps its own manifest, its own lockfile and its own CI job;
# nothing here is a member of it and nothing there is a member of this. See
# docs/M1-IMPLEMENTATION-PLAN.md section 1.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rumarcel/atrium"

[workspace.dependencies]
# Deliberately small. Every addition to this list is reviewed against
# docs/M1-IMPLEMENTATION-PLAN.md section 18, and the crate-boundary rules are
# enforced mechanically by server/ci/boundary-checks.sh.
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "json",
    "env-filter",
] }
nix = { version = "0.29", default-features = false }

# M1B: identity, certificates and the state store. Section 18 of the plan
# names each of these and says where it may be used.
getrandom = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
x509-parser = { version = "0.18", default-features = false }
zeroize = { version = "1", default-features = false, features = ["std"] }

# M1D: the TLS listener. Plan section 18.1 names rustls and its exporter as
# the one TLS stack; hyper is the HTTP/1.1 implementation. There is no web
# framework: M1's routes are a fixed table dispatched by exact match (plan
# section 17, M1D as built). Core only; the gates keep all of these out of
# Agent and the shared crates.
bytes = { version = "1", default-features = false, features = ["std"] }
http = { version = "1", default-features = false, features = ["std"] }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

atrium-api-types = { path = "crates/atrium-api-types" }
atrium-pairing = { path = "crates/atrium-pairing" }
atrium-protocol = { path = "crates/atrium-protocol" }

[profile.release]
strip = "symbols"
lto = "thin"
panic = "abort"
