[package]
name = "atrium-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atrium Core: the unprivileged server component"

# Core must never gain a container-runtime client, a shell helper, or a
# dependency on atrium-agent. server/ci/boundary-checks.sh enforces all three
# against cargo's own metadata, not against a reviewer's memory.
[dependencies]
atrium-api-types.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
atrium-protocol.workspace = true
getrandom.workspace = true
hex.workspace = true
nix = { workspace = true, features = ["user", "fs", "net"] }
rcgen.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "signal",
    "sync",
    "time",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }
