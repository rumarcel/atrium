[package]
name = "atrium-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atrium: pure shared types and constants (no I/O)"

# Types and a codec, nothing else. serde and serde_json describe and parse
# data; neither performs I/O. server/ci/boundary-checks.sh fails the build if
# an I/O, HTTP, TLS or SQL crate ever reaches this crate's dependency graph.
[dependencies]
serde.workspace = true
serde_json.workspace = true
