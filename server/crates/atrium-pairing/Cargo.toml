[package]
name = "atrium-pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atrium: pure shared types and constants (no I/O)"

# Pure cryptographic primitives and codecs only: no I/O, no randomness source
# (callers pass bytes they drew from the OS), no runtime. The boundary gate
# fails the build if an I/O crate ever reaches this graph.
[dependencies]
base64.workspace = true
hkdf.workspace = true
hmac.workspace = true
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
