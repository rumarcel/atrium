# cargo-deny configuration for the Atrium server workspace.
#
# The dependency *boundaries* that matter for security are enforced by
# server/ci/boundary-checks.sh, which runs in CI on every change and needs no
# extra tooling. This file adds the licence, advisory and duplicate checks on
# top; wiring `cargo deny` into CI belongs to the pass that adds advisory
# scanning, and is noted in docs/M1-IMPLEMENTATION-PLAN.md section 18.

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Never, in any crate of this workspace. These duplicate the mechanical checks
# in boundary-checks.sh so that a `cargo deny` run alone also catches them.
deny = [
    { name = "bollard" },
    { name = "docker-api" },
    { name = "shiplift" },
    { name = "podman-api" },
    { name = "containerd-client" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
